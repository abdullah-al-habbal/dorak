name: Backend CI

on:
  push:
    branches: ["master"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

# The Laravel app lives in backend/ of the monorepo; every run step executes there.
# actions/checkout and uses: steps are unaffected by this default.
defaults:
  run:
    working-directory: backend

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    # MySQL 8.4 on 127.0.0.1:3307 is the only test server, the same image and port as the local
    # backend/docker-compose.test.yml. phpunit.xml forces the connection and TestDatabaseGuard refuses anything else
    # (MariaDB, another version, another port or database, parallel runs). One database: dorak_test.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dorak_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # phpunit.xml forces the same connection (127.0.0.1:3307, root/root, dorak_test); these values are for the
      # bootstrap steps that run outside phpunit and must match it.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_DATABASE: dorak_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, tokenizer, pdo_mysql
          coverage: none

      # Deployments migrate BEFORE the atomic swap, so the previous release
      # serves traffic against the new schema. Only expand (backward-compatible)
      # migrations are safe there. This also rejects edits to already-shipped
      # migrations, which `migrate` never re-runs — the divergence that commit
      # 8a07a89 introduced on the preferred_universe default.
      # Policy: docs/16-deployment-operations.md
      - name: Migration expand/contract guard
        shell: bash
        run: |
          set -euo pipefail

          # The checkout has full history (fetch-depth: 0). --require-base makes a missing base ref a failure: without it
          # the guard falls back to scanning everything, which silently skips the "shipped migration was edited" check.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            # pull_request: diff against the target branch
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            BASE="origin/$GITHUB_BASE_REF"
          else
            # push: diff against the previous head
            BASE="${{ github.event.before }}"
          fi

          echo "base ref: $BASE"
          if [ -z "$BASE" ] || [ "${BASE//0/}" = "" ]; then
            # A brand-new branch has no previous head (all zeros): nothing has shipped from it, scan every migration.
            php scripts/check_migrations.php --all
          else
            php scripts/check_migrations.php --base="$BASE" --require-base
          fi

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check formatting
        run: vendor/bin/pint --test

      # --no-scripts is deliberate and must stay. Laravel's post-autoload-dump
      # script runs `artisan package:discover`, which boots the app and loads
      # modules/Core/Config/filesystems.php. That file evaluates
      # rtrim(env('APP_URL'), '/') with no default, so on a clean checkout with
      # no .env it dies with:
      #   TypeError: rtrim(): Argument #1 ($string) must be of type string, null given
      # Verified against a clean `git archive` of HEAD: composer install WITH
      # scripts exits 1. Dependency installation must not depend on app config.
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts

      # Package discovery is not skipped, only deferred until an environment
      # exists. Running it explicitly here still validates that every service
      # provider registers and the app boots — the check the composer script
      # would have given us — but from a known-good environment.
      - name: Prepare environment
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          php artisan package:discover --ansi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail

          # This is a modular layout: app/ and routes/ do not exist. Naming a
          # missing directory makes find exit non-zero, which under pipefail
          # fails the whole step, so iterate only over what is present.
          for dir in bootstrap config database modules tests; do
            [ -d "$dir" ] || continue
            echo "→ $dir"
            find "$dir" -type f -name '*.php' -print0 \
              | xargs -0 -r -n1 php -l > /dev/null
          done

      - name: Wait for MySQL
        shell: bash
        run: |
          set -euo pipefail

          # Probe with PDO rather than mysqladmin: pdo_mysql is installed by
          # the Setup PHP step above, whereas a MySQL client on the runner
          # image is not something this workflow controls. A successful PDO
          # connect also proves auth works, which a TCP check does not.
          for i in $(seq 1 30); do
            if php -r '
                try {
                  new PDO("mysql:host=127.0.0.1;port=3307;dbname=dorak_test", "root", "root");
                  exit(0);
                } catch (Throwable $e) {
                  exit(1);
                }' 2>/dev/null; then
              echo "✅ MySQL ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "❌ MySQL did not become ready within 60s"
          exit 1

      # One test database (dorak_test), recreated clean before each run. Never pass --parallel: the guard refuses it.
      - name: Reset test database
        run: php scripts/reset_test_database.php

      - name: Run tests
        run: php artisan test --without-tty

      # Real two-connection tests: they commit rows, so they run after the default suite, which excludes them.
      - name: Run concurrency tests
        run: php scripts/reset_test_database.php && php artisan test --group=concurrency
